  <circle cx="116" cy="88" r="22" fill="#ffffff"/>
  <ellipse cx="76" cy="88" rx="14" ry="16" fill="#2d3748"/>
  <ellipse cx="114" cy="88" rx="14" ry="16" fill="#2d3748"/>
  <circle cx="72" cy="82" r="6" fill="#ffffff"/>
  <circle cx="78" cy="92" r="2.5" fill="#ffffff"/>
  <circle cx="110" cy="82" r="6" fill="#ffffff"/>
