  <path d="M 60 46 C 42 56, 38 94, 38 126 C 38 159, 62 172, 95 172 C 128 172, 152 159, 152 126 C 152 94, 148 56, 130 46 C 114 38, 102 48, 95 48 C 88 48, 76 38, 60 46 Z" fill="url(#owlPinkGrad)"/>

