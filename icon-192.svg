<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Main Shopping Cart Graphic -->
  <g filter="url(#glow)">
    <!-- Cart wheels -->
    <circle cx="180" cy="385" r="26" fill="#f8fafc"/>
    <circle cx="180" cy="385" r="12" fill="#0f766e"/>
    <circle cx="340" cy="385" r="26" fill="#f8fafc"/>
    <circle cx="340" cy="385" r="12" fill="#0f766e"/>

    <!-- Cart body -->
    <path d="M110 130 H160 L195 310 C198 325 210 335 225 335 H365 C380 335 392 325 395 310 L425 180 C428 168 418 156 405 156 H170" 
          fill="none" stroke="#f8fafc" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Cart grid bars -->
    <line x1="215" y1="180" x2="235" y2="305" stroke="rgba(255,255,255,0.7)" stroke-width="10" stroke-linecap="round"/>
    <line x1="280" y1="180" x2="295" y2="305" stroke="rgba(255,255,255,0.7)" stroke-width="10" stroke-linecap="round"/>
    <line x1="345" y1="180" x2="355" y2="305" stroke="rgba(255,255,255,0.7)" stroke-width="10" stroke-linecap="round"/>
    <line x1="180" y1="230" x2="400" y2="230" stroke="rgba(255,255,255,0.7)" stroke-width="10" stroke-linecap="round"/>

    <!-- Fresh Nutrition Leaf / Protein Sparkle rising from cart -->
    <path d="M290 140 C290 85 345 75 355 75 C355 125 315 155 290 140 Z" fill="url(#leafGrad)"/>
    <path d="M355 75 C355 110 325 125 305 130" stroke="#bbf7d0" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Shield / Nutri Badge Star -->
    <g transform="translate(250, 80) scale(0.75)">
      <circle cx="0" cy="0" r="32" fill="url(#goldGrad)"/>
      <path d="M0 -18 L5 -5 L18 -4 L8 6 L11 19 L0 12 L-11 19 L-8 6 L-18 -4 L-5 -5 Z" fill="#ffffff"/>
    </g>
  </g>
</svg>
