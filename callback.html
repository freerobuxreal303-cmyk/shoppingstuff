<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Authenticating with Google...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #fff0f5;
      color: #db2777;
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #fce7f3;
      border-top-color: #ec4899;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p style="font-weight: 700; font-size: 14px;">Login Google Berhasil!</p>
  <p style="font-size: 12px; color: #64748b; margin-top: 4px;">Menutup jendela otomatis dan kembali ke aplikasi...</p>

  <script>
    (function() {
      try {
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const token = hashParams.get('access_token');

        if (token) {
          if (window.opener) {
            window.opener.postMessage({
              type: 'SUPABASE_OAUTH_POPUP_SUCCESS',
              token: token,
              hash: window.location.hash
            }, '*');
          }
          localStorage.setItem('smart_grocery_popup_token', token);
        }
      } catch (e) {
        console.warn('Callback error:', e);
      }

      setTimeout(() => {
        if (window.opener && window.opener !== window) {
          window.close();
        } else {
          window.location.href = './';
        }
      }, 250);
    })();
  </script>
</body>
</html>
