<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="owlPinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff75b3"/>
      <stop offset="100%" stop-color="#f43f8e"/>
    </linearGradient>
    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe4f0"/>
      <stop offset="100%" stop-color="#ffd0e5"/>
    </linearGradient>
    <linearGradient id="bowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48dbb4"/>
      <stop offset="100%" stop-color="#1eb58e"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#ec4899" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- FEET -->
    <ellipse cx="78" cy="178" rx="14" ry="7" fill="#ff9900"/>
    <ellipse cx="112" cy="178" rx="14" ry="7" fill="#ff9900"/>

    <!-- MAIN BODY -->
    <path d="M 60 52 
             C 42 62, 38 100, 38 132 
             C 38 165, 62 178, 95 178 
             C 128 178, 152 165, 152 132 
             C 152 100, 148 62, 130 52 
             C 114 44, 102 54, 95 54 
             C 88 54, 76 44, 60 52 Z" 
          fill="url(#owlPinkGrad)"/>

    <!-- LEFT WING -->
    <path d="M 40 108 C 22 118, 18 142, 32 152 C 40 158, 48 145, 48 132 Z" fill="#ff5c9d"/>

    <!-- BELLY PATCH -->
    <path d="M 62 118 C 62 98, 128 98, 128 118 C 128 152, 118 172, 95 172 C 72 172, 62 152, 62 118 Z" fill="url(#bellyGrad)"/>
    
    <!-- BELLY FEATHER SCALLOPS -->
    <path d="M 85 130 Q 95 136 105 130" stroke="#f472b6" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 80 144 Q 95 150 110 144" stroke="#f472b6" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 86 156 Q 95 161 104 156" stroke="#f472b6" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- EYES -->
    <!-- Eye whites -->
    <circle cx="74" cy="94" r="22" fill="#ffffff"/>
    <circle cx="116" cy="94" r="22" fill="#ffffff"/>
    <circle cx="74" cy="94" r="21" fill="#ffffff" stroke="#fce7f3" stroke-width="1"/>
    <circle cx="116" cy="94" r="21" fill="#ffffff" stroke="#fce7f3" stroke-width="1"/>

    <!-- Pupils -->
    <ellipse cx="76" cy="94" rx="14" ry="16" fill="#2d3748"/>
    <ellipse cx="114" cy="94" rx="14" ry="16" fill="#2d3748"/>

    <!-- Eye Highlights -->
    <circle cx="72" cy="88" r="6" fill="#ffffff"/>
    <circle cx="78" cy="98" r="2.5" fill="#ffffff"/>
    <circle cx="110" cy="88" r="6" fill="#ffffff"/>
    <circle cx="116" cy="98" r="2.5" fill="#ffffff"/>

    <!-- BEAK -->
    <path d="M 88 100 Q 95 98 102 100 C 103 110, 98 118, 95 118 C 92 118, 87 110, 88 100 Z" fill="#ff9900"/>
    <path d="M 91 102 Q 95 105 99 102" fill="#ffaa00"/>

    <!-- TURQUOISE BOW ON FOREHEAD -->
    <g transform="translate(95, 48)">
      <!-- Left bow loop -->
      <path d="M 0 0 C -12 -10, -22 -6, -20 2 C -18 9, -8 4, 0 0 Z" fill="url(#bowGrad)"/>
      <!-- Right bow loop -->
      <path d="M 0 0 C 12 -10, 22 -6, 20 2 C 18 9, 8 4, 0 0 Z" fill="url(#bowGrad)"/>
      <!-- Center knot -->
      <circle cx="0" cy="0" r="4.5" fill="#38cfab"/>
      <circle cx="-0.5" cy="-0.5" r="3" fill="#6ee7b7"/>
    </g>

    <!-- RIGHT WING HOLDING SHOPPING BAG -->
    <g transform="translate(138, 110)">
      <!-- Wing curve -->
      <path d="M 0 0 C 14 6, 24 20, 18 34 C 12 40, -4 28, -6 16 Z" fill="#ff5c9d"/>
      <!-- Hand / wingtip holding handle -->
      <circle cx="18" cy="30" r="5" fill="#ff75b3"/>
      
      <!-- SHOPPING BAG -->
      <!-- Handles -->
      <path d="M 12 30 C 12 18, 26 18, 26 30" fill="none" stroke="#fbcfe8" stroke-width="3" stroke-linecap="round"/>
      <path d="M 14 30 C 14 20, 24 20, 24 30" fill="none" stroke="#be185d" stroke-width="2" stroke-linecap="round"/>
      <!-- Bag Body -->
      <path d="M 6 30 L 32 30 L 36 65 C 36 67, 34 69, 31 69 L 7 69 C 4 69, 2 67, 2 65 Z" fill="url(#bagGrad)"/>
      <!-- Bag Fold Highlight -->
      <path d="M 8 32 L 30 32 L 33 65 L 5 65 Z" fill="none" stroke="#f472b6" stroke-width="1" opacity="0.6"/>
      <!-- Cute Shopping Cart / Heart Emblem on Bag -->
      <g transform="translate(19, 48) scale(0.7)">
        <circle cx="0" cy="0" r="10" fill="#ffffff" opacity="0.95"/>
        <path d="M -5 -3 L -3 -3 L -1 3 L 5 3 L 6 -1 L -2 -1" fill="none" stroke="#db2777" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="0" cy="6" r="1.5" fill="#db2777"/>
        <circle cx="4" cy="6" r="1.5" fill="#db2777"/>
      </g>
    </g>

    <!-- CHEEK BLUSH -->
    <ellipse cx="56" cy="112" rx="7" ry="4" fill="#ff3385" opacity="0.3"/>
    <ellipse cx="134" cy="112" rx="7" ry="4" fill="#ff3385" opacity="0.3"/>
  </g>
</svg>
