<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="100%" height="100%">
  <defs>
    <linearGradient id="emptyOwlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6fa9"/>
      <stop offset="100%" stop-color="#f4478f"/>
    </linearGradient>
    <linearGradient id="emptyBowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
  </defs>

  <!-- SOFT SHADOW GROUND -->
  <ellipse cx="120" cy="126" rx="95" ry="8" fill="#fce7f3" opacity="0.85"/>

  <!-- EMPTY MODERN WIRE SHOPPING CART (LEFT) -->
  <g transform="translate(18, 30)">
    <!-- Cart Wheels -->
    <circle cx="24" cy="80" r="5.5" fill="#64748b"/>
    <circle cx="24" cy="80" r="2.8" fill="#f8fafc"/>
    <circle cx="68" cy="80" r="5.5" fill="#64748b"/>
    <circle cx="68" cy="80" r="2.8" fill="#f8fafc"/>
    
    <!-- Cart Under-chassis frame -->
    <path d="M 14 76 L 74 76 L 68 52" fill="none" stroke="#db2777" stroke-width="2.8" stroke-linecap="round"/>
    
    <!-- Wire basket outline -->
    <path d="M 20 22 L 78 22 L 66 60 L 26 60 Z" fill="#fff5f9" fill-opacity="0.6" stroke="#ec4899" stroke-width="2.6" stroke-linejoin="round"/>
    <!-- Wire grid horizontals -->
    <path d="M 22 35 L 74 35 M 24 48 L 70 48" stroke="#f472b6" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Wire grid verticals -->
    <path d="M 36 22 L 36 60 M 50 22 L 50 60 M 64 22 L 62 60" stroke="#f472b6" stroke-width="1.6" stroke-linecap="round"/>
    
    <!-- Handle bar with comfortable pink grip -->
    <path d="M 20 22 L 8 12" fill="none" stroke="#db2777" stroke-width="2.8" stroke-linecap="round"/>
    <rect x="2" y="7" width="11" height="8" rx="4" fill="#f43f8e"/>
  </g>

  <!-- AUTHENTIC PINK OWL MASCOT (RIGHT) -->
  <!-- Exactly matching the Duolingo-style proportions from media_1795538333314_a47ab7de.png -->
  <g transform="translate(122, 12)">
    <!-- FEET -->
    <ellipse cx="44" cy="112" rx="9" ry="5" fill="#ff9800"/>
    <ellipse cx="68" cy="112" rx="9" ry="5" fill="#ff9800"/>

    <!-- BODY WITH EAR TUFTS -->
    <path d="M 34 30 
             C 22 36, 16 60, 16 82 
             C 16 104, 32 112, 56 112 
             C 80 112, 96 104, 96 82 
             C 96 60, 90 36, 78 30 
             C 70 25, 62 31, 56 31 
             C 50 31, 42 25, 34 30 Z" 
          fill="url(#emptyOwlGrad)"/>

    <!-- LEFT WING RESTING ON CART HANDLE -->
    <path d="M 20 68 C 4 72, -8 56, -6 44 C -4 38, 10 48, 14 60 Z" fill="#ff4d94"/>
    <circle cx="-6" cy="42" r="3.5" fill="#ff6fa9"/>

    <!-- RIGHT WING WAVING -->
    <path d="M 92 68 C 104 62, 114 74, 106 84 C 98 90, 90 80, 90 70 Z" fill="#ff4d94"/>

    <!-- LIGHT PINK FACIAL MASK -->
    <path d="M 32 38 
             C 24 47, 24 73, 38 76 
             C 46 77, 52 72, 56 67 
             C 60 72, 66 77, 74 76 
             C 88 73, 88 47, 80 38 
             C 72 32, 64 36, 56 36 
             C 48 36, 40 32, 32 38 Z" 
          fill="#ffb3d5"/>

    <!-- BELLY PATCH -->
    <path d="M 36 78 C 36 66, 76 66, 76 78 C 76 98, 70 108, 56 108 C 42 108, 36 98, 36 78 Z" fill="#ffd4e5"/>

    <!-- BELLY FEATHER SCALLOPS -->
    <path d="M 48 86 Q 56 90 64 86" stroke="#f472b6" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M 44 94 Q 56 98 68 94" stroke="#f472b6" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M 50 101 Q 56 105 62 101" stroke="#f472b6" stroke-width="1.8" fill="none" stroke-linecap="round"/>

    <!-- BIG EXPRESSIVE EYES (Wide open, adorable & curious) -->
    <!-- Left Eye -->
    <ellipse cx="42" cy="57" rx="12" ry="14" fill="#ffffff"/>
    <ellipse cx="43" cy="57" rx="8.5" ry="10.5" fill="#2d3748"/>
    <circle cx="40" cy="53" r="3.6" fill="#ffffff"/>
    <circle cx="45" cy="60" r="1.8" fill="#ffffff"/>

    <!-- Right Eye -->
    <ellipse cx="70" cy="57" rx="12" ry="14" fill="#ffffff"/>
    <ellipse cx="69" cy="57" rx="8.5" ry="10.5" fill="#2d3748"/>
    <circle cx="66" cy="53" r="3.6" fill="#ffffff"/>
    <circle cx="71" cy="60" r="1.8" fill="#ffffff"/>

    <!-- ORANGE BEAK -->
    <path d="M 51 61 Q 56 60 61 61 C 62 67, 58 73, 56 73 C 54 73, 50 67, 51 61 Z" fill="#ff9800"/>
    <path d="M 52 62 Q 56 64 60 62" fill="#ffb300"/>

    <!-- MINT GREEN BOW TIE ON FOREHEAD -->
    <g transform="translate(56, 30)">
      <path d="M 0 0 C -8 -6, -14 -4, -13 2 C -12 7, -5 4, 0 0 Z" fill="url(#emptyBowGrad)"/>
      <path d="M 0 0 C 8 -6, 14 -4, 13 2 C 12 7, 5 4, 0 0 Z" fill="url(#emptyBowGrad)"/>
      <circle cx="0" cy="0" r="3" fill="#10b981"/>
      <circle cx="-0.4" cy="-0.4" r="1.8" fill="#6ee7b7"/>
    </g>
  </g>

  <!-- CUTE SPARKLES AROUND CART -->
  <g transform="translate(45, 24)" fill="#f472b6" opacity="0.8">
    <path d="M 0 -4 Q 0 0 4 0 Q 0 0 0 4 Q 0 0 -4 0 Q 0 0 0 -4 Z"/>
  </g>
  <g transform="translate(98, 18)" fill="#fb7185" opacity="0.85">
    <path d="M 0 -3 Q 0 0 3 0 Q 0 0 0 3 Q 0 0 -3 0 Q 0 0 0 -3 Z"/>
  </g>
</svg>
